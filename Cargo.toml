[package]
name = "screen_scanner"
version = "0.1.0"
edition = "2021"


[dependencies]
rxing = "0.6"
image = "0.25"
xcap = "0.0.14"
arboard = "3.4"
open = "5.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }
